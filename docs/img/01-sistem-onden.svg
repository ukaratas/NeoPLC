<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 392" width="700" height="392" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="700" height="392" fill="#faf9f7"/>

  <text x="30" y="30" font-size="16" font-weight="700" fill="#26241f">NeoPLC — Sistem Ön Görünüm</text>
  <text x="30" y="47" font-size="11" fill="#8a857c">Host 2U blade + 8 node slotu · 1U = 17.5 mm · 2U = 35 mm · ölçek 1 : 0.36</text>

  <!-- sasi -->
  <rect x="90" y="66" width="518" height="224" rx="5" fill="#eceae5" stroke="#26241f" stroke-width="2"/>

  <!-- ================= HOST 2U BLADE ================= -->
  <rect x="96" y="72" width="98" height="212" rx="2.5" fill="#2f4858" stroke="#1d2e38" stroke-width="1"/>
  <text x="145" y="92" font-size="11" font-weight="700" fill="#e8f0f4" text-anchor="middle">HOST</text>
  <text x="145" y="105" font-size="8" fill="#9db6c4" text-anchor="middle">2U · ESP32-S3</text>

  <!-- LEDler -->
  <circle cx="112" cy="122" r="3.4" fill="#4caf50"/><text x="120" y="125" font-size="7" fill="#c8d8e0">PWR</text>
  <circle cx="112" cy="136" r="3.4" fill="#3d8bd4"/><text x="120" y="139" font-size="7" fill="#c8d8e0">RUN</text>
  <circle cx="158" cy="122" r="3.4" fill="#d9a441"/><text x="166" y="125" font-size="7" fill="#c8d8e0">BUS</text>
  <circle cx="158" cy="136" r="3.4" fill="#c0563a"/><text x="166" y="139" font-size="7" fill="#c8d8e0">FLT</text>

  <!-- WiFi butonu -->
  <circle cx="122" cy="166" r="9" fill="#3d5a80" stroke="#8fb4d9" stroke-width="1.4"/>
  <path d="M117 166 a7 7 0 0 1 10 0 M119.5 169 a3.5 3.5 0 0 1 5 0" fill="none" stroke="#e8f0f4" stroke-width="1.2"/>
  <text x="122" y="187" font-size="7" fill="#9db6c4" text-anchor="middle">WiFi</text>
  <text x="122" y="196" font-size="6.5" fill="#7a95a5" text-anchor="middle">10 dk</text>

  <!-- USB-C -->
  <rect x="152" y="161" width="26" height="9" rx="4.5" fill="#57534a"/>
  <text x="165" y="187" font-size="7" fill="#9db6c4" text-anchor="middle">USB-C</text>

  <!-- anten -->
  <line x1="186" y1="200" x2="186" y2="176" stroke="#c8d8e0" stroke-width="1.8"/>
  <circle cx="186" cy="173" r="3" fill="none" stroke="#c8d8e0" stroke-width="1.6"/>
  <text x="186" y="212" font-size="6.5" fill="#7a95a5" text-anchor="middle">ANT</text>

  <!-- RS-485 klemens (3 kutup, yatay) -->
  <rect x="104" y="212" width="82" height="34" rx="2" fill="#2f7d4f" stroke="#16341f" stroke-width="1.2"/>
  <circle cx="122" cy="229" r="5" fill="#0f2416"/>
  <circle cx="145" cy="229" r="5" fill="#0f2416"/>
  <circle cx="168" cy="229" r="5" fill="#0f2416"/>
  <text x="122" y="258" font-size="7" fill="#9db6c4" text-anchor="middle">A</text>
  <text x="145" y="258" font-size="7" fill="#9db6c4" text-anchor="middle">B</text>
  <text x="168" y="258" font-size="7" fill="#9db6c4" text-anchor="middle">G</text>
  <text x="145" y="273" font-size="7.5" fill="#9db6c4" text-anchor="middle">RS-485</text>

  <line x1="196" y1="72" x2="196" y2="284" stroke="#c9c4ba" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- ================= SLOT 1 : DI 4ch ================= -->
  <rect x="199" y="72" width="47" height="212" rx="2.5" fill="#3d5a80" stroke="#2a3f5c" stroke-width="1"/>
  <circle cx="213" cy="86" r="2.8" fill="#7fd48a"/><circle cx="232" cy="86" r="2.8" fill="#7fd48a"/>
  <text transform="rotate(-90 222 150)" x="222" y="150" font-size="9" font-weight="600" fill="#eef2f7" text-anchor="middle">DI · 4 kanal</text>
  <rect x="200" y="228" width="45" height="34" rx="2" fill="#2f7d4f" stroke="#1d5233"/>
  <g fill="#0f2416"><circle cx="205" cy="245" r="3"/><circle cx="214" cy="245" r="3"/><circle cx="223" cy="245" r="3"/><circle cx="232" cy="245" r="3"/><circle cx="241" cy="245" r="3"/></g>

  <!-- ================= SLOT 2 : DO-M 4ch ================= -->
  <rect x="248" y="72" width="47" height="212" rx="2.5" fill="#3d5a80" stroke="#2a3f5c" stroke-width="1"/>
  <circle cx="262" cy="86" r="2.8" fill="#7fd48a"/><circle cx="281" cy="86" r="2.8" fill="#d9a441"/>
  <text transform="rotate(-90 271 150)" x="271" y="150" font-size="9" font-weight="600" fill="#eef2f7" text-anchor="middle">DO-M · 4 kanal</text>
  <rect x="249" y="228" width="45" height="34" rx="2" fill="#2f7d4f" stroke="#1d5233"/>
  <g fill="#0f2416"><circle cx="254" cy="245" r="3"/><circle cx="263" cy="245" r="3"/><circle cx="272" cy="245" r="3"/><circle cx="281" cy="245" r="3"/><circle cx="290" cy="245" r="3"/></g>

  <!-- ================= SLOT 3-4 : AC 16A 2U ================= -->
  <rect x="297" y="72" width="96" height="212" rx="2.5" fill="#4a3f5c" stroke="#332b41" stroke-width="1"/>
  <circle cx="312" cy="86" r="2.8" fill="#7fd48a"/><circle cx="331" cy="86" r="2.8" fill="#c0563a"/>
  <text x="345" y="122" font-size="11" font-weight="700" fill="#f2eef7" text-anchor="middle">AC 16A</text>
  <text x="345" y="137" font-size="8.5" fill="#d9c8ef" text-anchor="middle">3 kanal · 230 V~</text>
  <rect x="298" y="208" width="94" height="54" rx="2" fill="#8a5a2f" stroke="#5c3a1c"/>
  <g fill="#2b1a0c"><circle cx="315" cy="235" r="6"/><circle cx="336" cy="235" r="6"/><circle cx="357" cy="235" r="6"/><circle cx="378" cy="235" r="6"/></g>
  <g font-size="7" fill="#f0e4d6" text-anchor="middle"><text x="315" y="256">L1</text><text x="336" y="256">L2</text><text x="357" y="256">L3</text><text x="378" y="256">N</text></g>

  <!-- ================= SLOT 5 : DO-L 4ch ================= -->
  <rect x="395" y="72" width="47" height="212" rx="2.5" fill="#3d5a80" stroke="#2a3f5c" stroke-width="1"/>
  <circle cx="409" cy="86" r="2.8" fill="#7fd48a"/><circle cx="428" cy="86" r="2.8" fill="#7fd48a"/>
  <text transform="rotate(-90 418 150)" x="418" y="150" font-size="9" font-weight="600" fill="#eef2f7" text-anchor="middle">DO-L · 4 kanal</text>
  <rect x="396" y="228" width="45" height="34" rx="2" fill="#2f7d4f" stroke="#1d5233"/>
  <g fill="#0f2416"><circle cx="401" cy="245" r="3"/><circle cx="410" cy="245" r="3"/><circle cx="419" cy="245" r="3"/><circle cx="428" cy="245" r="3"/><circle cx="437" cy="245" r="3"/></g>

  <!-- ================= SLOT 6 : AI 4ch ================= -->
  <rect x="444" y="72" width="47" height="212" rx="2.5" fill="#3d5a80" stroke="#2a3f5c" stroke-width="1"/>
  <circle cx="458" cy="86" r="2.8" fill="#7fd48a"/><circle cx="477" cy="86" r="2.8" fill="#7fd48a"/>
  <text transform="rotate(-90 467 150)" x="467" y="150" font-size="9" font-weight="600" fill="#eef2f7" text-anchor="middle">AI · 4 kanal</text>
  <rect x="445" y="228" width="45" height="34" rx="2" fill="#2f7d4f" stroke="#1d5233"/>
  <g fill="#0f2416"><circle cx="450" cy="245" r="3"/><circle cx="459" cy="245" r="3"/><circle cx="468" cy="245" r="3"/><circle cx="477" cy="245" r="3"/><circle cx="486" cy="245" r="3"/></g>

  <!-- ================= SLOT 7-8 : DC 64A 2U ================= -->
  <rect x="493" y="72" width="96" height="212" rx="2.5" fill="#5c4033" stroke="#3d2a20" stroke-width="1"/>
  <circle cx="508" cy="86" r="2.8" fill="#7fd48a"/><circle cx="527" cy="86" r="2.8" fill="#d9a441"/>
  <text x="541" y="122" font-size="11" font-weight="700" fill="#f7ece3" text-anchor="middle">DC 64A</text>
  <text x="541" y="137" font-size="8.5" fill="#e8c9ab" text-anchor="middle">1 kanal · hibrit</text>
  <rect x="494" y="204" width="94" height="58" rx="2" fill="#a8641f" stroke="#6b3d0f"/>
  <circle cx="518" cy="233" r="11" fill="#2b1a0c"/>
  <circle cx="564" cy="233" r="11" fill="#2b1a0c"/>
  <text x="518" y="256" font-size="7.5" fill="#f5e6d3" text-anchor="middle">IN</text>
  <text x="564" y="256" font-size="7.5" fill="#f5e6d3" text-anchor="middle">OUT</text>

  <!-- slot numaralari -->
  <g font-size="8.5" fill="#8a857c" text-anchor="middle">
    <text x="145" y="304" font-weight="700" fill="#2f4858">HOST</text>
    <text x="222" y="304">1</text><text x="271" y="304">2</text>
    <text x="320" y="304">3</text><text x="369" y="304">4</text>
    <text x="418" y="304">5</text><text x="467" y="304">6</text>
    <text x="516" y="304">7</text><text x="565" y="304">8</text>
  </g>

  <!-- olculer -->
  <g stroke="#8a857c" stroke-width="1">
    <line x1="199" y1="316" x2="199" y2="330"/><line x1="246" y1="316" x2="246" y2="330"/>
    <line x1="199" y1="323" x2="246" y2="323"/>
  </g>
  <path d="M199 323 l6 -3 v6 z M246 323 l-6 -3 v6 z" fill="#8a857c"/>
  <text x="222" y="343" font-size="9" fill="#5c574e" text-anchor="middle">17.5</text>

  <g stroke="#8a857c" stroke-width="1">
    <line x1="96" y1="316" x2="96" y2="330"/><line x1="194" y1="316" x2="194" y2="330"/>
    <line x1="96" y1="323" x2="194" y2="323"/>
  </g>
  <path d="M96 323 l6 -3 v6 z M194 323 l-6 -3 v6 z" fill="#8a857c"/>
  <text x="145" y="343" font-size="9" fill="#5c574e" text-anchor="middle">35.0 (2U host)</text>

  <g stroke="#26241f" stroke-width="1">
    <line x1="199" y1="354" x2="199" y2="368"/><line x1="589" y1="354" x2="589" y2="368"/>
    <line x1="199" y1="361" x2="589" y2="361"/>
  </g>
  <path d="M199 361 l7 -3.5 v7 z M589 361 l-7 -3.5 v7 z" fill="#26241f"/>
  <text x="394" y="381" font-size="10" font-weight="600" fill="#26241f" text-anchor="middle">8 × 17.5 = 140.0 mm (node kapasitesi)</text>

  <g stroke="#26241f" stroke-width="1">
    <line x1="90" y1="354" x2="90" y2="368"/>
  </g>
  <text x="112" y="381" font-size="9" fill="#5c574e">toplam ≈ 185 mm</text>

  <!-- yukseklik -->
  <g stroke="#8a857c" stroke-width="1">
    <line x1="74" y1="66" x2="60" y2="66"/><line x1="74" y1="290" x2="60" y2="290"/>
    <line x1="67" y1="66" x2="67" y2="290"/>
  </g>
  <path d="M67 66 l-3 6 h6 z M67 290 l-3 -6 h6 z" fill="#8a857c"/>
  <text transform="rotate(-90 48 178)" x="48" y="178" font-size="9" fill="#5c574e" text-anchor="middle">80.0</text>

  <!-- renk kodu -->
  <text x="624" y="86" font-size="9" font-weight="700" fill="#26241f">Renk</text>
  <rect x="624" y="94" width="10" height="10" fill="#2f4858"/><text x="639" y="103" font-size="7.5" fill="#5c574e">Host</text>
  <rect x="624" y="110" width="10" height="10" fill="#3d5a80"/><text x="639" y="119" font-size="7.5" fill="#5c574e">1U DC</text>
  <rect x="624" y="126" width="10" height="10" fill="#4a3f5c"/><text x="639" y="135" font-size="7.5" fill="#5c574e">2U AC</text>
  <rect x="624" y="142" width="10" height="10" fill="#5c4033"/><text x="639" y="151" font-size="7.5" fill="#5c574e">2U güç</text>

  <text x="624" y="176" font-size="7.5" fill="#8a857c">DC giriş klemensi</text>
  <text x="624" y="187" font-size="7.5" fill="#8a857c">arka panelde</text>
</svg>
