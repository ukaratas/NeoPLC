<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="470" fill="#faf9f7"/>

  <text x="30" y="30" font-size="16" font-weight="700" fill="#26241f">Blade Şasi — Üstten Kesit</text>
  <text x="30" y="47" font-size="11" fill="#8a857c">Host dahil her kart bir blade · kızak rayları · backplane · ön taraf yukarıda</text>

  <defs>
    <marker id="ins" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#bf5b25"/></marker>
  </defs>

  <!-- bolum etiketleri -->
  <text x="138" y="88" font-size="9.5" font-weight="700" fill="#2f4858" text-anchor="middle">HOST SLOTU (2U)</text>
  <text x="348" y="88" font-size="9.5" font-weight="600" fill="#5c574e" text-anchor="middle">NODE SLOTLARI · 8 × 17.5 mm</text>

  <!-- takma oku -->
  <path d="M453 62 v30" stroke="#bf5b25" stroke-width="2.4" marker-end="url(#ins)"/>
  <text x="466" y="72" font-size="9.5" font-weight="600" fill="#bf5b25">önden tak</text>
  <rect x="446" y="94" width="14" height="12" fill="#bf5b25"/>

  <!-- sasi -->
  <rect x="90" y="108" width="432" height="272" rx="4" fill="#eceae5" stroke="#26241f" stroke-width="2"/>

  <!-- host / node ayirici -->
  <line x1="180" y1="108" x2="180" y2="380" stroke="#c9c4ba" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ===== KIZAK RAYLARI ===== -->
  <g stroke="#a89f90" stroke-width="3.5" stroke-linecap="round">
    <!-- host slotu: 2U -->
    <line x1="96" y1="118" x2="96" y2="292"/>
    <line x1="180" y1="118" x2="180" y2="292"/>
    <!-- node slotlari: 8 x 1U -->
    <line x1="222" y1="118" x2="222" y2="292"/>
    <line x1="264" y1="118" x2="264" y2="292"/>
    <line x1="306" y1="118" x2="306" y2="292"/>
    <line x1="348" y1="118" x2="348" y2="292"/>
    <line x1="390" y1="118" x2="390" y2="292"/>
    <line x1="432" y1="118" x2="432" y2="292"/>
    <line x1="474" y1="118" x2="474" y2="292"/>
    <line x1="516" y1="118" x2="516" y2="292"/>
  </g>

  <!-- ===== BACKPLANE ===== -->
  <rect x="96" y="300" width="420" height="20" fill="#2d6a4f" stroke="#1d5233" stroke-width="1"/>
  <text x="350" y="314" font-size="9.5" font-weight="600" fill="#eaf4ee" text-anchor="middle">BACKPLANE PCB</text>

  <!-- host konnektoru (farkli, genis) -->
  <rect x="104" y="288" width="68" height="12" rx="1" fill="#e0a83a" stroke="#8a6a12" stroke-width="1"/>
  <text x="138" y="297" font-size="6.5" font-weight="700" fill="#4a3a08" text-anchor="middle">HOST KON.</text>

  <!-- node soketleri -->
  <g fill="#c9a227">
    <rect x="190" y="290" width="24" height="10" rx="1"/><rect x="232" y="290" width="24" height="10" rx="1"/>
    <rect x="274" y="290" width="24" height="10" rx="1"/><rect x="316" y="290" width="24" height="10" rx="1"/>
    <rect x="358" y="290" width="24" height="10" rx="1"/><rect x="400" y="290" width="24" height="10" rx="1"/>
    <rect x="442" y="290" width="24" height="10" rx="1"/><rect x="484" y="290" width="24" height="10" rx="1"/>
  </g>

  <!-- ===== ARKA PLENUM + FAN ===== -->
  <rect x="96" y="326" width="420" height="48" rx="3" fill="#f7ece3" stroke="#bf5b25" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="210" y="354" font-size="8.5" fill="#bf5b25">arka plenum</text>
  <circle cx="432" cy="350" r="21" fill="#fff" stroke="#bf5b25" stroke-width="2"/>
  <path d="M432 333 a17 17 0 0 1 14.7 8.5 M432 367 a17 17 0 0 1 -14.7 -8.5 M446.7 358.5 a17 17 0 0 1 -29.4 0" fill="none" stroke="#bf5b25" stroke-width="1.6"/>
  <text x="432" y="392" font-size="8" fill="#bf5b25" text-anchor="middle">FAN</text>

  <!-- DC giris (arka panel) -->
  <rect x="112" y="368" width="40" height="14" rx="2" fill="#57534a"/>
  <text x="132" y="378" font-size="7" fill="#fff" text-anchor="middle">DC IN</text>
  <text x="132" y="396" font-size="7.5" fill="#8a857c" text-anchor="middle">arka panelde</text>

  <!-- ===== HOST BLADE ===== -->
  <rect x="120" y="112" width="36" height="14" fill="#2f4858"/>
  <rect x="135" y="126" width="6" height="164" fill="#2d6a4f"/>
  <text transform="rotate(-90 112 200)" x="112" y="200" font-size="8.5" font-weight="700" fill="#2f4858" text-anchor="middle">HOST 2U</text>

  <!-- ===== NODE BLADE'LER ===== -->
  <g>
    <rect x="194" y="112" width="14" height="14" fill="#3d5a80"/>
    <rect x="199" y="126" width="5" height="164" fill="#2d6a4f"/>
  </g>
  <g>
    <rect x="236" y="112" width="14" height="14" fill="#3d5a80"/>
    <rect x="241" y="126" width="5" height="164" fill="#2d6a4f"/>
  </g>
  <g>
    <rect x="278" y="112" width="14" height="14" fill="#3d5a80"/>
    <rect x="283" y="126" width="5" height="164" fill="#2d6a4f"/>
  </g>
  <g>
    <rect x="362" y="112" width="14" height="14" fill="#3d5a80"/>
    <rect x="367" y="126" width="5" height="164" fill="#2d6a4f"/>
  </g>
  <g>
    <rect x="404" y="112" width="14" height="14" fill="#3d5a80"/>
    <rect x="409" y="126" width="5" height="164" fill="#2d6a4f"/>
  </g>

  <!-- yarim takili blade -->
  <rect x="450" y="106" width="5" height="120" fill="#2d6a4f" stroke="#bf5b25" stroke-width="1"/>
  <rect x="448" y="226" width="9" height="6" fill="#c9a227"/>
  <text x="444" y="264" font-size="8" fill="#bf5b25" text-anchor="end">yarım takılı</text>

  <!-- bos slot -->
  <rect x="480" y="118" width="30" height="172" fill="none" stroke="#c9c4ba" stroke-width="1" stroke-dasharray="4 3"/>
  <text transform="rotate(-90 495 204)" x="495" y="204" font-size="8" fill="#a89f90" text-anchor="middle">boş → kör kapak</text>

  <text x="60" y="352" font-size="9" fill="#8a857c">ARKA</text>
  <text x="60" y="120" font-size="9" fill="#8a857c">ÖN</text>

  <!-- ===== OLCULER ===== -->
  <g stroke="#8a857c" stroke-width="1">
    <line x1="96" y1="410" x2="96" y2="424"/><line x1="180" y1="410" x2="180" y2="424"/>
    <line x1="96" y1="417" x2="180" y2="417"/>
  </g>
  <path d="M96 417 l6 -3 v6 z M180 417 l-6 -3 v6 z" fill="#8a857c"/>
  <text x="138" y="437" font-size="9" fill="#5c574e" text-anchor="middle">35.0 (2U)</text>

  <g stroke="#26241f" stroke-width="1">
    <line x1="180" y1="410" x2="180" y2="424"/><line x1="516" y1="410" x2="516" y2="424"/>
    <line x1="180" y1="417" x2="516" y2="417"/>
  </g>
  <path d="M180 417 l7 -3.5 v7 z M516 417 l-7 -3.5 v7 z" fill="#26241f"/>
  <text x="348" y="437" font-size="9.5" font-weight="600" fill="#26241f" text-anchor="middle">8 × 17.5 = 140.0 mm</text>

  <text x="306" y="456" font-size="9" fill="#8a857c" text-anchor="middle">toplam slot alanı 175 mm · şasi ≈ 185 mm</text>

  <!-- derinlik -->
  <g stroke="#8a857c" stroke-width="1">
    <line x1="548" y1="126" x2="562" y2="126"/><line x1="548" y1="290" x2="562" y2="290"/>
    <line x1="555" y1="126" x2="555" y2="290"/>
  </g>
  <path d="M555 126 l-3 6 h6 z M555 290 l-3 -6 h6 z" fill="#8a857c"/>
  <text transform="rotate(-90 576 208)" x="576" y="208" font-size="9" fill="#5c574e" text-anchor="middle">PCB derinliği 110</text>

  <!-- ===== KEYING UYARISI ===== -->
  <rect x="588" y="108" width="160" height="80" rx="4" fill="#fff8ec" stroke="#bf5b25" stroke-width="1.3"/>
  <text x="600" y="126" font-size="9" font-weight="700" fill="#bf5b25">Host konnektörü farklı</text>
  <text x="600" y="142" font-size="8" fill="#5c574e">Slot başına RST# / PRESENT#</text>
  <text x="600" y="153" font-size="8" fill="#5c574e">hatları host'a gider —</text>
  <text x="600" y="164" font-size="8" fill="#5c574e">node konnektöründe yok.</text>
  <text x="600" y="180" font-size="8" font-weight="700" fill="#bf5b25">Mekanik keying zorunlu.</text>

  <!-- ===== DETAY ===== -->
  <circle cx="306" cy="200" r="17" fill="none" stroke="#bf5b25" stroke-width="1.4" stroke-dasharray="3 2"/>
  <line x1="320" y1="192" x2="590" y2="230" stroke="#bf5b25" stroke-width="1" stroke-dasharray="3 2"/>

  <rect x="588" y="204" width="160" height="112" rx="4" fill="#fff" stroke="#bf5b25" stroke-width="1.4"/>
  <text x="600" y="222" font-size="9" font-weight="700" fill="#bf5b25">DETAY — kızak oluğu</text>
  <path d="M606 240 h40 v13 h-11 v9 h-18 v-9 h-11 z" fill="#d8d3c8" stroke="#8a857c" stroke-width="1.1"/>
  <path d="M664 240 h40 v13 h-11 v9 h-18 v-9 h-11 z" fill="#d8d3c8" stroke="#8a857c" stroke-width="1.1"/>
  <rect x="638" y="236" width="34" height="4" fill="#2d6a4f"/>
  <rect x="626" y="253" width="58" height="4" fill="#2d6a4f"/>
  <text x="655" y="282" font-size="8" fill="#2d6a4f" text-anchor="middle">PCB 1.6 mm</text>
  <text x="600" y="298" font-size="7.5" fill="#8a857c">Üst ve altta birer tek parça ray;</text>
  <text x="600" y="308" font-size="7.5" fill="#8a857c">adım toleransı kalıptan gelir.</text>
</svg>
