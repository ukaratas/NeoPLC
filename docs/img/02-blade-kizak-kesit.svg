<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="470" fill="#faf9f7"/>

  <text x="30" y="30" font-size="16" font-weight="700" fill="#26241f">Blade Şasi — Üstten Kesit</text>
  <text x="30" y="47" font-size="11" fill="#8a857c">Kızak rayları · backplane · blade takma yönü · ön taraf yukarıda</text>

  <defs>
    <marker id="ins" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#bf5b25"/></marker>
  </defs>

  <!-- takma oku (ustten asagi) -->
  <path d="M470 60 v34" stroke="#bf5b25" stroke-width="2.4" marker-end="url(#ins)"/>
  <text x="484" y="76" font-size="9.5" font-weight="600" fill="#bf5b25">önden tak</text>

  <!-- yarim takili blade'in on paneli (sasi disinda) -->
  <rect x="462" y="96" width="16" height="12" fill="#bf5b25"/>

  <!-- sasi -->
  <rect x="70" y="110" width="500" height="238" rx="4" fill="#eceae5" stroke="#26241f" stroke-width="2"/>
  <text x="300" y="104" font-size="9" fill="#8a857c" text-anchor="middle">ÖN (ön paneller) · 8 kanal · 17.5 mm adım</text>

  <!-- host bolumu -->
  <rect x="76" y="116" width="178" height="226" rx="3" fill="#f7f6f3" stroke="#c9c4ba"/>
  <text x="85" y="132" font-size="10" font-weight="700" fill="#3d5a80">HOST PCB</text>
  <rect x="86" y="142" width="60" height="38" rx="2" fill="#2d6a4f" opacity="0.75"/>
  <text x="116" y="165" font-size="8" fill="#fff" text-anchor="middle">ESP32-S3</text>
  <rect x="86" y="190" width="46" height="32" rx="2" fill="#57534a" opacity="0.7"/>
  <text x="109" y="209" font-size="7.5" fill="#fff" text-anchor="middle">GÜÇ</text>
  <rect x="150" y="190" width="46" height="32" rx="2" fill="#57534a" opacity="0.45"/>
  <text x="173" y="209" font-size="7.5" fill="#fff" text-anchor="middle">RS-485</text>

  <!-- fan (arkada) -->
  <circle cx="165" cy="292" r="26" fill="none" stroke="#4a7fb5" stroke-width="2"/>
  <path d="M165 270 a22 22 0 0 1 19 11 M165 314 a22 22 0 0 1 -19 -11 M184 303 a22 22 0 0 1 -38 0" fill="none" stroke="#4a7fb5" stroke-width="1.6"/>
  <text x="165" y="332" font-size="8" fill="#4a7fb5" text-anchor="middle">FAN</text>

  <line x1="260" y1="116" x2="260" y2="342" stroke="#c9c4ba" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- kizak dilimleri (on -> arka) -->
  <g stroke="#a89f90" stroke-width="3" stroke-linecap="round">
    <line x1="266" y1="120" x2="266" y2="296"/>
    <line x1="301" y1="120" x2="301" y2="296"/>
    <line x1="336" y1="120" x2="336" y2="296"/>
    <line x1="371" y1="120" x2="371" y2="296"/>
    <line x1="406" y1="120" x2="406" y2="296"/>
    <line x1="441" y1="120" x2="441" y2="296"/>
    <line x1="476" y1="120" x2="476" y2="296"/>
    <line x1="511" y1="120" x2="511" y2="296"/>
    <line x1="546" y1="120" x2="546" y2="296"/>
  </g>

  <!-- backplane (arkada) -->
  <rect x="266" y="310" width="298" height="18" fill="#2d6a4f" stroke="#1d5233" stroke-width="1"/>
  <text x="440" y="323" font-size="9" font-weight="600" fill="#eaf4ee" text-anchor="middle">BACKPLANE PCB</text>
  <g fill="#c9a227">
    <rect x="272" y="300" width="22" height="10" rx="1"/><rect x="307" y="300" width="22" height="10" rx="1"/>
    <rect x="342" y="300" width="22" height="10" rx="1"/><rect x="377" y="300" width="22" height="10" rx="1"/>
    <rect x="412" y="300" width="22" height="10" rx="1"/><rect x="447" y="300" width="22" height="10" rx="1"/>
    <rect x="482" y="300" width="22" height="10" rx="1"/><rect x="517" y="300" width="22" height="10" rx="1"/>
  </g>

  <!-- takili blade'ler: on panel yukarida, kart kenari asagida -->
  <g>
    <rect x="276" y="114" width="15" height="12" fill="#3d5a80"/>
    <rect x="281" y="126" width="5" height="174" fill="#2d6a4f"/>
    <rect x="279" y="294" width="9" height="6" fill="#c9a227"/>
  </g>
  <g>
    <rect x="311" y="114" width="15" height="12" fill="#3d5a80"/>
    <rect x="316" y="126" width="5" height="174" fill="#2d6a4f"/>
    <rect x="314" y="294" width="9" height="6" fill="#c9a227"/>
  </g>
  <g>
    <rect x="346" y="114" width="15" height="12" fill="#3d5a80"/>
    <rect x="351" y="126" width="5" height="174" fill="#2d6a4f"/>
    <rect x="349" y="294" width="9" height="6" fill="#c9a227"/>
  </g>
  <g>
    <rect x="416" y="114" width="15" height="12" fill="#3d5a80"/>
    <rect x="421" y="126" width="5" height="174" fill="#2d6a4f"/>
    <rect x="419" y="294" width="9" height="6" fill="#c9a227"/>
  </g>

  <!-- yarim takili blade (slot 7) -->
  <rect x="468" y="108" width="5" height="130" fill="#2d6a4f" stroke="#bf5b25" stroke-width="1"/>
  <rect x="466" y="238" width="9" height="6" fill="#c9a227"/>
  <text x="462" y="258" font-size="8.5" fill="#bf5b25" text-anchor="middle">yarım takılı</text>

  <!-- bos slot -->
  <rect x="521" y="120" width="20" height="176" fill="none" stroke="#c9c4ba" stroke-width="1" stroke-dasharray="4 3"/>
  <text transform="rotate(-90 531 208)" x="531" y="208" font-size="8" fill="#a89f90" text-anchor="middle">boş → kör kapak</text>

  <text x="600" y="336" font-size="9" fill="#8a857c" text-anchor="middle">ARKA</text>

  <!-- derinlik olcusu -->
  <g stroke="#8a857c" stroke-width="1">
    <line x1="596" y1="126" x2="610" y2="126"/><line x1="596" y1="300" x2="610" y2="300"/>
    <line x1="603" y1="126" x2="603" y2="300"/>
  </g>
  <path d="M603 126 l-3 6 h6 z M603 300 l-3 -6 h6 z" fill="#8a857c"/>
  <text transform="rotate(-90 626 213)" x="626" y="213" font-size="9" fill="#5c574e" text-anchor="middle">PCB derinliği 110</text>

  <!-- detay balonu: bir ray uzerinde -->
  <circle cx="371" cy="200" r="18" fill="none" stroke="#bf5b25" stroke-width="1.4" stroke-dasharray="3 2"/>
  <line x1="386" y1="210" x2="470" y2="370" stroke="#bf5b25" stroke-width="1" stroke-dasharray="3 2"/>

  <rect x="400" y="372" width="290" height="86" rx="4" fill="#fff" stroke="#bf5b25" stroke-width="1.4"/>
  <text x="414" y="390" font-size="9.5" font-weight="700" fill="#bf5b25">DETAY — kızak oluğu</text>
  <path d="M440 406 h44 v14 h-12 v10 h-20 v-10 h-12 z" fill="#d8d3c8" stroke="#8a857c" stroke-width="1.2"/>
  <path d="M504 406 h44 v14 h-12 v10 h-20 v-10 h-12 z" fill="#d8d3c8" stroke="#8a857c" stroke-width="1.2"/>
  <rect x="476" y="402" width="36" height="4" fill="#2d6a4f"/>
  <rect x="462" y="420" width="64" height="4" fill="#2d6a4f"/>
  <text x="560" y="410" font-size="8" fill="#2d6a4f">PCB 1.6 mm</text>
  <text x="560" y="424" font-size="8" fill="#5c574e">oluk kenarı kavrar</text>
  <text x="414" y="444" font-size="8" fill="#8a857c">Üst ve altta birer tek parça ray — 8 oluk aynı</text>
  <text x="414" y="454" font-size="8" fill="#8a857c">parçada, adım toleransı kalıptan gelir.</text>
</svg>
