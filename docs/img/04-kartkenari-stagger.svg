<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="470" fill="#faf9f7"/>

  <text x="30" y="30" font-size="16" font-weight="700" fill="#26241f">Kart Kenarı Konnektörü — 26 Pin, 4 Kademeli Stagger</text>
  <text x="30" y="47" font-size="11" fill="#8a857c">Finger boyları farklı → mate sırası bedava geliyor</text>

  <defs><marker id="dn" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#bf5b25"/></marker></defs>

  <!-- ============ PROFIL ============ -->
  <text x="30" y="78" font-size="11" font-weight="700" fill="#26241f">Takma sırası (profil)</text>

  <rect x="40" y="92" width="230" height="32" fill="#2d6a4f"/>
  <text x="155" y="113" font-size="9" fill="#d8e8df" text-anchor="middle">NODE PCB</text>

  <rect x="50"  y="124" width="24" height="74" fill="#c9a227"/>
  <rect x="92"  y="124" width="24" height="58" fill="#c9a227"/>
  <rect x="134" y="124" width="24" height="42" fill="#c9a227"/>
  <rect x="176" y="124" width="24" height="42" fill="#c9a227"/>
  <rect x="218" y="124" width="24" height="26" fill="#c9a227"/>

  <line x1="30" y1="208" x2="282" y2="208" stroke="#26241f" stroke-width="2"/>
  <text x="30" y="224" font-size="8.5" fill="#5c574e">soket teması</text>

  <!-- takma yonu: dikey ok -->
  <path d="M298 100 v84" stroke="#bf5b25" stroke-width="2.4" marker-end="url(#dn)"/>
  <text transform="rotate(-90 312 142)" x="312" y="142" font-size="9" font-weight="600" fill="#bf5b25" text-anchor="middle">takma yönü</text>

  <!-- kademe etiketleri -->
  <g font-size="8" text-anchor="middle">
    <text x="62"  y="244" fill="#2f7d4f" font-weight="700">1</text><text x="62"  y="256" fill="#5c574e">GND</text>
    <text x="104" y="244" fill="#3d5a80" font-weight="700">2</text><text x="104" y="256" fill="#5c574e">Güç</text><text x="104" y="266" fill="#5c574e">ADDR</text>
    <text x="146" y="244" fill="#7a5ea8" font-weight="700">3</text><text x="146" y="256" fill="#5c574e">Sinyal</text>
    <text x="188" y="244" fill="#7a5ea8" font-weight="700">3</text>
    <text x="230" y="244" fill="#bf5b25" font-weight="700">4</text><text x="230" y="256" fill="#5c574e">PRESENT#</text>
  </g>

  <!-- aciklama kutusu -->
  <rect x="340" y="84" width="350" height="146" rx="4" fill="#fff" stroke="#c9c4ba"/>
  <text x="354" y="104" font-size="10" font-weight="700" fill="#26241f">Neden bu sıra?</text>
  <text x="354" y="123" font-size="8.8" fill="#5c574e"><tspan font-weight="700" fill="#2f7d4f">1 · GND</tspan> — referans her şeyden önce oturmalı</text>
  <text x="354" y="141" font-size="8.8" fill="#5c574e"><tspan font-weight="700" fill="#3d5a80">2 · Güç + ADDR</tspan> — besleme gelir, slot kimliği geçerli olur</text>
  <text x="354" y="159" font-size="8.8" fill="#5c574e"><tspan font-weight="700" fill="#7a5ea8">3 · Sinyaller</tspan> — bus ve kontrol hatları bağlanır</text>
  <text x="354" y="177" font-size="8.8" fill="#5c574e"><tspan font-weight="700" fill="#bf5b25">4 · PRESENT#</tspan> — "tam oturdu" sinyali, en son</text>
  <line x1="354" y1="190" x2="676" y2="190" stroke="#e5e1d9"/>
  <text x="354" y="206" font-size="8.5" fill="#8a857c">Host, PRESENT# düşene kadar node'u yok sayar.</text>
  <text x="354" y="219" font-size="8.5" fill="#8a857c">Yarım oturmuş node sistemi hiç etkilemez.</text>

  <!-- ============ PIN TABLOSU ============ -->
  <text x="30" y="298" font-size="11" font-weight="700" fill="#26241f">Pin dizilimi</text>

  <g font-size="7.5" text-anchor="middle">
    <rect x="40"  y="310" width="54" height="28" fill="#d6ecdd" stroke="#2f7d4f"/><text x="67"  y="328" fill="#1d5233" font-weight="700">GND ×4</text>
    <rect x="96"  y="310" width="54" height="28" fill="#dbe4f2" stroke="#3d5a80"/><text x="123" y="324" fill="#2a3f5c" font-weight="700">VBUS ×2</text><text x="123" y="334" fill="#2a3f5c">12–48 V</text>
    <rect x="152" y="310" width="54" height="28" fill="#dbe4f2" stroke="#3d5a80"/><text x="179" y="324" fill="#2a3f5c" font-weight="700">+5V_SYS</text><text x="179" y="334" fill="#2a3f5c">×2</text>
    <rect x="208" y="310" width="60" height="28" fill="#dbe4f2" stroke="#3d5a80"/><text x="238" y="324" fill="#2a3f5c" font-weight="700">ADDR0–3</text><text x="238" y="334" fill="#2a3f5c">coğrafi</text>
    <rect x="270" y="310" width="56" height="28" fill="#e7dff2" stroke="#7a5ea8"/><text x="298" y="324" fill="#4a3f5c" font-weight="700">BUS_A/B</text><text x="298" y="334" fill="#4a3f5c">RS-485</text>
    <rect x="328" y="310" width="62" height="28" fill="#f2f0ec" stroke="#a89f90" stroke-dasharray="3 2"/><text x="359" y="324" fill="#8a857c" font-weight="700">RSVD ×2</text><text x="359" y="334" fill="#8a857c">tam dupleks</text>

    <rect x="40"  y="344" width="54" height="28" fill="#e7dff2" stroke="#7a5ea8"/><text x="67"  y="362" fill="#4a3f5c" font-weight="700">MOD_RST#</text>
    <rect x="96"  y="344" width="54" height="28" fill="#e7dff2" stroke="#7a5ea8"/><text x="123" y="362" fill="#4a3f5c" font-weight="700">BOOT#</text>
    <rect x="152" y="344" width="54" height="28" fill="#e7dff2" stroke="#7a5ea8"/><text x="179" y="362" fill="#4a3f5c" font-weight="700">FAULT#</text>
    <rect x="208" y="344" width="60" height="28" fill="#e7dff2" stroke="#7a5ea8"/><text x="238" y="362" fill="#4a3f5c" font-weight="700">SYNC</text>
    <rect x="270" y="344" width="56" height="28" fill="#f2f0ec" stroke="#a89f90" stroke-dasharray="3 2"/><text x="298" y="358" fill="#8a857c" font-weight="700">RSVD ×4</text><text x="298" y="368" fill="#8a857c">3V3 + yedek</text>
    <rect x="328" y="344" width="62" height="28" fill="#fbe3d4" stroke="#bf5b25"/><text x="359" y="358" fill="#8a3f16" font-weight="700">PRESENT#</text><text x="359" y="368" fill="#8a3f16">+ GND</text>
  </g>

  <g font-size="8.5">
    <rect x="420" y="310" width="12" height="12" fill="#d6ecdd" stroke="#2f7d4f"/><text x="438" y="320" fill="#5c574e">Kademe 1 — GND</text>
    <rect x="420" y="330" width="12" height="12" fill="#dbe4f2" stroke="#3d5a80"/><text x="438" y="340" fill="#5c574e">Kademe 2 — Güç ve slot adresi</text>
    <rect x="420" y="350" width="12" height="12" fill="#e7dff2" stroke="#7a5ea8"/><text x="438" y="360" fill="#5c574e">Kademe 3 — Bus ve kontrol sinyalleri</text>
    <rect x="420" y="370" width="12" height="12" fill="#fbe3d4" stroke="#bf5b25"/><text x="438" y="380" fill="#5c574e">Kademe 4 — PRESENT# (en kısa, en son)</text>
    <rect x="420" y="390" width="12" height="12" fill="#f2f0ec" stroke="#a89f90" stroke-dasharray="3 2"/><text x="438" y="400" fill="#5c574e">Rezerve — gelecek genişleme</text>
  </g>

  <text x="40" y="394" font-size="8.5" fill="#8a857c">Toplam 26 pin · 2.54 mm adım · çift sıra</text>

  <rect x="30" y="418" width="660" height="36" rx="4" fill="#f2f0ec" stroke="#c9c4ba"/>
  <text x="44" y="434" font-size="9" fill="#5c574e">Node tarafında konnektör <tspan font-weight="700">parçası yok</tspan> — sadece PCB üzerinde gold finger.</text>
  <text x="44" y="447" font-size="9" fill="#5c574e">Stagger, finger boylarını farklı çizmekle elde ediliyor: <tspan font-weight="700">ek maliyet sıfır.</tspan></text>
</svg>
