<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 480" width="740" height="480" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="740" height="480" fill="#faf9f7"/>

  <text x="30" y="30" font-size="16" font-weight="700" fill="#26241f">Kart Kenarı Konnektörü — 12 Pin, 4 Kademeli Stagger</text>
  <text x="30" y="47" font-size="11" fill="#8a857c">8 fonksiyonel + 4 rezerve · finger boyları farklı → mate sırası bedava</text>

  <defs><marker id="dn" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#bf5b25"/></marker></defs>

  <!-- ===================== PROFIL ===================== -->
  <text x="30" y="80" font-size="11" font-weight="700" fill="#26241f">Takma sırası (profil)</text>

  <rect x="40" y="94" width="250" height="30" fill="#2d6a4f"/>
  <text x="165" y="114" font-size="9" fill="#d8e8df" text-anchor="middle">NODE PCB</text>

  <!-- kademeli fingerlar -->
  <rect x="50"  y="124" width="22" height="72" fill="#c9a227"/>
  <rect x="82"  y="124" width="22" height="72" fill="#c9a227"/>
  <rect x="120" y="124" width="22" height="56" fill="#c9a227"/>
  <rect x="152" y="124" width="22" height="56" fill="#c9a227"/>
  <rect x="190" y="124" width="22" height="40" fill="#c9a227"/>
  <rect x="222" y="124" width="22" height="40" fill="#c9a227"/>
  <rect x="260" y="124" width="22" height="24" fill="#c9a227"/>

  <line x1="30" y1="206" x2="300" y2="206" stroke="#26241f" stroke-width="2"/>
  <text x="30" y="222" font-size="8.5" fill="#5c574e">soket teması</text>

  <path d="M312 100 v82" stroke="#bf5b25" stroke-width="2.4" marker-end="url(#dn)"/>
  <text transform="rotate(-90 334 141)" x="334" y="141" font-size="9" font-weight="600" fill="#bf5b25" text-anchor="middle">takma yönü</text>

  <g font-size="8" text-anchor="middle">
    <text x="77"  y="242" fill="#2f7d4f" font-weight="700">Kademe 1</text><text x="77"  y="254" fill="#5c574e">GND ×2</text>
    <text x="147" y="242" fill="#3d5a80" font-weight="700">Kademe 2</text><text x="147" y="254" fill="#5c574e">+5V ×2</text>
    <text x="210" y="242" fill="#7a5ea8" font-weight="700">Kademe 3</text><text x="210" y="254" fill="#5c574e">Bus · RST#</text>
    <text x="278" y="242" fill="#bf5b25" font-weight="700">Kademe 4</text><text x="278" y="266" fill="#5c574e">PRESENT#</text>
  </g>

  <!-- aciklama -->
  <rect x="352" y="88" width="358" height="126" rx="4" fill="#fff" stroke="#c9c4ba"/>
  <text x="366" y="107" font-size="10" font-weight="700" fill="#26241f">Neden bu sıra?</text>
  <text x="366" y="126" font-size="8.8" fill="#5c574e"><tspan font-weight="700" fill="#2f7d4f">1 · GND</tspan> — referans her şeyden önce oturmalı</text>
  <text x="366" y="144" font-size="8.8" fill="#5c574e"><tspan font-weight="700" fill="#3d5a80">2 · +5V</tspan> — besleme gelir</text>
  <text x="366" y="162" font-size="8.8" fill="#5c574e"><tspan font-weight="700" fill="#7a5ea8">3 · Bus + RST#</tspan> — haberleşme ve kontrol bağlanır</text>
  <text x="366" y="180" font-size="8.8" fill="#5c574e"><tspan font-weight="700" fill="#bf5b25">4 · PRESENT#</tspan> — "tam oturdu" sinyali, en son</text>
  <line x1="366" y1="190" x2="696" y2="190" stroke="#e5e1d9"/>
  <text x="366" y="206" font-size="8.5" fill="#8a857c">Host, PRESENT# düşene kadar node'u yok sayar.</text>

  <!-- ===================== PIN TABLOSU ===================== -->
  <text x="30" y="290" font-size="11" font-weight="700" fill="#26241f">Pin dizilimi — 2 sıra × 6 · 15.24 mm</text>

  <g font-size="8" text-anchor="middle">
    <rect x="40"  y="302" width="52" height="30" fill="#d6ecdd" stroke="#2f7d4f"/><text x="66"  y="316" fill="#1d5233" font-weight="700">1 GND</text><text x="66" y="327" fill="#1d5233">kademe 1</text>
    <rect x="94"  y="302" width="52" height="30" fill="#d6ecdd" stroke="#2f7d4f"/><text x="120" y="316" fill="#1d5233" font-weight="700">2 GND</text><text x="120" y="327" fill="#1d5233">redundans</text>
    <rect x="148" y="302" width="52" height="30" fill="#dbe4f2" stroke="#3d5a80"/><text x="174" y="316" fill="#2a3f5c" font-weight="700">3 +5V</text><text x="174" y="327" fill="#2a3f5c">150 mA</text>
    <rect x="202" y="302" width="52" height="30" fill="#dbe4f2" stroke="#3d5a80"/><text x="228" y="316" fill="#2a3f5c" font-weight="700">4 +5V</text><text x="228" y="327" fill="#2a3f5c">redundans</text>
    <rect x="256" y="302" width="52" height="30" fill="#e7dff2" stroke="#7a5ea8"/><text x="282" y="316" fill="#4a3f5c" font-weight="700">5 BUS_A</text><text x="282" y="327" fill="#4a3f5c">RS-485</text>
    <rect x="310" y="302" width="52" height="30" fill="#e7dff2" stroke="#7a5ea8"/><text x="336" y="316" fill="#4a3f5c" font-weight="700">6 BUS_B</text><text x="336" y="327" fill="#4a3f5c">RS-485</text>

    <rect x="40"  y="336" width="52" height="30" fill="#e7dff2" stroke="#7a5ea8"/><text x="66"  y="350" fill="#4a3f5c" font-weight="700">7 RST#</text><text x="66" y="361" fill="#4a3f5c">slot başına</text>
    <rect x="94"  y="336" width="52" height="30" fill="#f2f0ec" stroke="#a89f90" stroke-dasharray="3 2"/><text x="120" y="354" fill="#8a857c" font-weight="700">8 RSVD</text>
    <rect x="148" y="336" width="52" height="30" fill="#f2f0ec" stroke="#a89f90" stroke-dasharray="3 2"/><text x="174" y="354" fill="#8a857c" font-weight="700">9 RSVD</text>
    <rect x="202" y="336" width="52" height="30" fill="#f2f0ec" stroke="#a89f90" stroke-dasharray="3 2"/><text x="228" y="354" fill="#8a857c" font-weight="700">10 RSVD</text>
    <rect x="256" y="336" width="52" height="30" fill="#f2f0ec" stroke="#a89f90" stroke-dasharray="3 2"/><text x="282" y="354" fill="#8a857c" font-weight="700">11 RSVD</text>
    <rect x="310" y="336" width="52" height="30" fill="#fbe3d4" stroke="#bf5b25"/><text x="336" y="350" fill="#8a3f16" font-weight="700">12 PRES#</text><text x="336" y="361" fill="#8a3f16">kademe 4</text>
  </g>

  <text x="40" y="384" font-size="8.5" fill="#8a857c">4 rezerve = 1 diferansiyel çift + 2 tek uçlu sinyal</text>

  <!-- ===================== KALDIRILANLAR ===================== -->
  <rect x="380" y="240" width="330" height="200" rx="4" fill="#fff8ec" stroke="#bf5b25" stroke-width="1.3"/>
  <text x="394" y="260" font-size="10.5" font-weight="700" fill="#bf5b25">26 → 12 pin · kaldırılanlar</text>

  <g font-size="8.4">
    <text x="394" y="281" fill="#26241f" font-weight="700">GND ×4 → ×2</text>
    <text x="394" y="292" fill="#8a857c">akım için 1 bile yeter; 2'si titreşim redundansı</text>

    <text x="394" y="311" fill="#26241f" font-weight="700">VBUS_RAW ×2 → yok</text>
    <text x="394" y="322" fill="#8a857c">tek müşterisi analog çıkış compliance'ıydı →</text>
    <text x="394" y="332" fill="#8a857c">o node'a $0.30 lokal boost daha ucuz</text>

    <text x="394" y="351" fill="#26241f" font-weight="700">ADDR0–3 → yok</text>
    <text x="394" y="362" fill="#8a857c">host RST# ile izole edip adres atıyor</text>

    <text x="394" y="381" fill="#26241f" font-weight="700">SYNC → broadcast çerçeve</text>
    <text x="394" y="392" fill="#8a857c">bus zaten broadcast; µs ≈ ns bu uygulamada</text>

    <text x="394" y="411" fill="#26241f" font-weight="700">FAULT# → poll · BOOT# → pencere</text>
    <text x="394" y="422" fill="#8a857c">100 ms gecikme önemsiz; RST# zaten izole ediyor</text>
  </g>

  <!-- alt not -->
  <rect x="30" y="398" width="330" height="44" rx="4" fill="#f2f0ec" stroke="#c9c4ba"/>
  <text x="44" y="415" font-size="8.6" fill="#5c574e">Backplane'de yönlendirilecek net: <tspan font-weight="700">208 → 96</tspan></text>
  <text x="44" y="431" font-size="8.6" fill="#5c574e">Backplane büyük olasılıkla <tspan font-weight="700">2 katmanda</tspan> kalabilir.</text>

  <rect x="30" y="452" width="680" height="20" rx="4" fill="#f2f0ec" stroke="#c9c4ba"/>
  <text x="44" y="466" font-size="8.6" fill="#5c574e">Node tarafında konnektör <tspan font-weight="700">parçası yok</tspan> — sadece PCB üzerinde gold finger. Stagger finger boyundan geliyor: <tspan font-weight="700">ek maliyet sıfır.</tspan></text>
</svg>
